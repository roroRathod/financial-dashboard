<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="bar1Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccff00"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Financial Chart Glyph -->
  <!-- Left Bar -->
  <rect x="32" y="66" width="16" height="32" rx="4" fill="url(#bar1Grad)" />
  <!-- Middle Bar -->
  <rect x="56" y="48" width="16" height="50" rx="4" fill="url(#bar2Grad)" />
  <!-- Right Bar -->
  <rect x="80" y="32" width="16" height="66" rx="4" fill="url(#bar3Grad)" />

  <!-- Trend Node Pulse Dot -->
  <circle cx="88" cy="22" r="5" fill="#ccff00" filter="url(#glow)"/>
</svg>
