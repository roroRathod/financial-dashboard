services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financial-dashboard-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CACHE_TTL_SECONDS=300
      - OPENAI_API_BASE=${OPENAI_API_BASE:-${LLM_BASE_URL:-http://localhost:3001/v1}}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-${LLM_API_KEY:-}}
      - OPENAI_MODEL=${OPENAI_MODEL:-${LLM_MODEL:-auto}}
    env_file:
      - path: ./backend/.env
        required: false
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financial-dashboard-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
